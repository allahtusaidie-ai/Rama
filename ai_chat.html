<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat | Ramadhana Website</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #eeeeee; 
            font-family: 'Poppins', sans-serif;
            margin: 0;
        /* Animation ya kuhema kwa page nzima kila sekunde 2 */
            animation: hema 2s ease-in-out infinite;
        }

        /* Animation ya Kuhema (Page) */
        @keyframes hema {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.99); /* Inajirudisha ndani kidogo kama inavuta pumzi */
            }
        }

      /* Navbar yenye rangi za dhahabu za Sizani */
        .navbar {
            background: rgba(0, 0, 0, 0.95) !important;
            border-bottom: 2px solid #ffc107;
            backdrop-filter: blur(10px);
        }

        .navbar-brand { 
            color: #ffc107 !important; 
            font-weight: bold;
            font-size: 1.8rem;
            display: inline-block;
            /* Animation ya kudunda kama moyo kila sekunde 1 */
            animation: dundaMoyo 1s infinite;
        }

        /* Animation ya Kudunda Moyo (Navbar Brand) */
        @keyframes dundaMoyo {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.15); /* Kudunda kwa kwanza (Nguvu) */
            }
            30% {
                transform: scale(1.07); /* Kurudi kidogo */
            }
            45% {
                transform: scale(1.15); /* Kudunda kwa pili (Mapigo ya moyo huwa yanadunda mara mbili pacha) */
            }
        }

        .nav-link {
            color: #ffffff !important;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffc107 !important;
        }
    
        /* Chat Container */
        .chat-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .chat-container { 
            background: #161616; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }

        .chat-header { 
            background: #ffc107; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.2rem;
            color: #000;
        }

        .chat-box { 
            height: 450px; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            background: #0f0f0f;
        }

        /* Message Bubbles */
        .message { 
            max-width: 80%; 
            padding: 12px 18px; 
            border-radius: 15px; 
            font-size: 0.95rem; 
            line-height: 1.5; 
        }

        .user-message { 
            align-self: flex-end; 
            background: #ffc107; 
            color: black; 
            border-bottom-right-radius: 2px; 
            font-weight: 500;
        }

        .ai-message { 
            align-self: flex-start; 
            background: #2a2a2a; 
            color: white; 
            border-bottom-left-radius: 2px;
            border: 1px solid #333;
        }

        /* Input Area */
        .chat-input-area { 
            display: flex; 
            padding: 15px; 
            background: #161616; 
            gap: 10px;
            border-top: 1px solid #2a2a2a;
        }

        .chat-input-area input { 
            flex: 1; 
            background: #0a0a0a; 
            border: 1px solid #333; 
            color: white; 
            padding: 12px; 
            border-radius: 10px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #ffc107;
        }

        .chat-input-area button { 
            background: #ffc107; 
            border: none; 
            padding: 0 25px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer;
            transition: 0.3s;
        }

        .chat-input-area button:hover { 
            background: #e0a800;
            transform: scale(1.05);
        }

        /* Custom Scrollbar */
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fs-3" href="{{ url_for('index') }}">RAMADHANA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('movie') }}">Movies</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('sizani') }}">Sizani</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('games') }}">Games</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('islamic') }}">Islamic</a></li>
                <li class="nav-item"><a class="nav-link active text-warning" href="{{ url_for('ai_chat') }}">AI Chat</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="chat-wrapper" data-aos="fade-up" data-aos-duration="1000">
    <div class="chat-container">
        <div class="chat-header">
            Msaidizi wa Ramadhana (AI)
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                Habari! Mimi ni msaidizi wako wa AI. Unaweza kuniuliza chochote kuhusu Movies, Games, au huduma zetu.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Andika ujumbe wako hapa..." autocomplete="off">
            <button onclick="sendMessage()">Tuma</button>
        </div>
    </div>
    
    <div  class="footer-bottom mt-5">
        <div class="container text-center py-3 border-top border-secondary">
            <p class="mb-0">&copy; 2026 <span class="text-warning fw-bold">RAMADHANA Entertainment</span>. Burudani ya Dhahabu Imesheheni.</p>
            <small class="text-secondary">Designed by DJ RAMADHAN AA</small>
        </div>
    </div>
</footer>

<style>
    .footer-section {
        background-color: #050505;
        padding: 60px 0 0;
        border-top: 2px solid #ffc107;
        color: #fff;
    }
    .footer-logo {
        font-size: 2rem;
        font-weight: 700;
        color: #ffc107;
        margin-bottom: 20px;
    }
    .footer-logo span { color: #fff; }
    .footer-desc { color: #888; font-size: 0.95rem; }
    
    .footer-links h4, .footer-contact h4 {
        font-size: 1.2rem;
        font-weight: bold;
        color: #ffc107;
        margin-bottom: 20px;
        position: relative;
    }
    .footer-links ul { list-style: none; padding: 0; }
    .footer-links ul li { padding: 10px 0; }
    .footer-links ul li a {
        color: #ccc;
        text-decoration: none;
        transition: 0.3s;
    }
    .footer-links ul li a:hover { color: #ffc107; padding-left: 5px; }

    .social-links a {
        font-size: 1.5rem;
        color: #ccc;
        margin-right: 15px;
        transition: 0.3s;
    }
    .social-links a:hover { color: #ffc107; }
    
    .footer-bottom p { font-size: 0.9rem; color: #aaa; }
</style>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const message = input.value.trim();

        if (message === "") return;

        // Ongeza swali la mtumiaji kwenye screen
        chatBox.innerHTML += `<div class="message user-message">${message}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Tuma data kwenda kwenye ai.py (Endpoint yako ya Flask)
            const response = await fetch('/ai-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            
            // Ongeza jibu la AI kwenye screen
            setTimeout(() => {
                chatBox.innerHTML += `<div class="message ai-message">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

        } catch (error) {
            console.error("Error:", error);
            chatBox.innerHTML += `<div class="message ai-message">Samahani, kuna tatizo la kiufundi. Jaribu tena baadaye.</div>`;
        }
    }

    // Ruhusu kutuma kwa kubonyeza "Enter"
    document.getElementById('userInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
