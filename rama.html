<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Rama</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0a0a0a; /* Giza la Sizani */
            color: #eeeeee; 
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
        /* Animation ya kuhema kwa page nzima kila sekunde 2 */
            animation: hema 2s ease-in-out infinite;
        }

        /* Animation ya Kuhema (Page) */
        @keyframes hema {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.99); /* Inajirudisha ndani kidogo kama inavuta pumzi */
            }
        }

        .login-box { 
            max-width: 400px; 
            width: 100%;
            background: #161616; 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid #2a2a2a;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        /* Animation ya kuhema kwa page nzima kila sekunde 2 */
            animation: hema 2s ease-in-out infinite;
        }

        /* Animation ya Kuhema (Page) */
        @keyframes hema {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.99); /* Inajirudisha ndani kidogo kama inavuta pumzi */
            }
        }

        /* Input Styling */
        .form-control {
            background-color: #0f0f0f;
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #1a1a1a;
            border-color: #ffc107;
            color: white;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.2);
        }
        .form-label { color: #ffc107; font-weight: 500; }

        /* Kitufe cha Admin (Dhahabu) */
        .btn-warning {
            background-color: #ffc107;
            border: none;
            color: black;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
            color: black;
        }

        .admin-title {
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffc107;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.2);
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-link:hover { color: #ffc107; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-box shadow-lg" data-aos="zoom-in" data-aos-duration="800">
        <div class="text-center mb-4">
            <h3 class="admin-title">ADMIN PANEL</h3>
            <p class="text-secondary small">Ingia kusimamia mfumo wa Ramadhana</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show border-0 small" role="alert" style="border-radius: 10px; background: #222; color: #fff;">
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Admin Username</label>
                <input type="text" name="username" class="form-control" placeholder="Jina la admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Nenosiri" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-warning shadow">Ingia Kama Admin</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="back-link">&larr; Rudi Nyumbani</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
